name: Deploy contratalux.com

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/inteligenciasevilla/web/contratalux.com/public_html/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar el sitio (public/)
        run: |
          npm ci
          npm run build

      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir archivos al hosting
        run: |
          rsync -avz --delete \
            ./public/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}"
